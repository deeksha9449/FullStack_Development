<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ heading }} - Student Attendance</title>
<style>
:root{--bg:#f3f5fb;--card:#fff;--text:#1e293b;--muted:#64748b;--primary:#4f46e5;--dark:#4338ca;--border:#e2e8f0;--green:#16a34a;--red:#dc2626;--amber:#d97706}
body.dark{--bg:#0b1120;--card:#172033;--text:#e2e8f0;--muted:#94a3b8;--border:#2b3a52}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
.sidebar{position:fixed;top:0;bottom:0;left:0;width:240px;padding:22px 14px;background:linear-gradient(180deg,#312e81,#1e1b4b);color:#fff}
.brand{padding:0 10px 22px;font-size:18px;font-weight:700}
.brand small{display:block;font-size:12px;font-weight:400;color:#a5b4fc}
.sidebar a{display:block;padding:11px 14px;margin-bottom:3px;border-radius:10px;color:#c7d2fe;text-decoration:none}
.sidebar a:hover{background:rgba(255,255,255,.1)}
.sidebar a.active{background:var(--primary);color:#fff}
.content{margin-left:240px}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 32px;background:var(--card);border-bottom:1px solid var(--border)}
#today{color:var(--muted);font-size:14px}
.page{padding:30px 32px;max-width:1200px}
h1{margin:0 0 4px;font-size:26px}
.sub{margin:0 0 24px;color:var(--muted)}
.panel{margin-top:20px;padding:22px;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 2px 10px rgba(15,23,42,.06)}
.btn{display:inline-block;padding:9px 18px;border:0;border-radius:9px;background:var(--primary);color:#fff;font-size:14px;font-weight:600;text-decoration:none;cursor:pointer}
.btn:hover{background:var(--dark)}
.btn.light{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn.sm{padding:6px 12px;font-size:12px}
input{padding:10px 13px;border:1px solid var(--border);border-radius:9px;background:var(--card);color:var(--text);font-size:14px}
input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.2)}
label{display:block;margin-bottom:6px;font-size:13px;font-weight:600;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin-bottom:22px}
.form-grid input{width:100%}
.toasts{position:fixed;top:74px;right:20px;z-index:20}
.toast{margin-bottom:10px;padding:13px 20px;border-radius:10px;background:var(--primary);color:#fff;font-weight:600;box-shadow:0 8px 22px rgba(0,0,0,.25)}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}
@media(max-width:820px){.sidebar{position:static;width:100%}.content{margin-left:0}.page,.topbar{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="brand">Attendance<small>Student management</small></div>
  <a href="/">Dashboard</a>
  <a href="/add/">Add Student</a>
  <a href="/students/">Students</a>
  <a href="/mark/">Mark Attendance</a>
  <a href="/reports/">Reports</a>
  <a href="/admin/">Admin Panel</a>
</aside>

<div class="content">
  <div class="topbar">
    <span id="today"></span>
    <button class="btn light sm" id="theme" type="button">Dark / Light</button>
  </div>

  {% if messages %}
  <div class="toasts">{% for m in messages %}<div class="toast {{ m.tags }}">{{ m }}</div>{% endfor %}</div>
  {% endif %}

  <div class="page">
    <h1>{{ heading }}</h1>
    <p class="sub">Fill in the student details</p>

    <div class="panel">
      <form method="post">
        {% csrf_token %}
        <div class="form-grid">
          <div><label>Roll number</label><input type="text" name="roll_no" id="roll" value="{{ f.roll_no }}" placeholder="e.g. BCA001" required></div>
          <div><label>Full name</label><input type="text" name="name" value="{{ f.name }}" placeholder="Full name" required></div>
          <div><label>Email</label><input type="email" name="email" value="{{ f.email }}" placeholder="name@example.com" required></div>
          <div><label>Course</label><input type="text" name="course" value="{{ f.course }}" placeholder="e.g. BCA" required></div>
          <div><label>Phone (10 digits, optional)</label><input type="text" name="phone" id="phone" value="{{ f.phone }}" placeholder="10 digit number"></div>
        </div>
        <button class="btn" type="submit">Save student</button>
        <a class="btn light" href="/students/">Cancel</a>
      </form>
    </div>
  </div>
</div>

<script>
var b = document.body;
if (localStorage.getItem("theme") === "dark") b.classList.add("dark");
document.getElementById("theme").onclick = function () {
  b.classList.toggle("dark");
  localStorage.setItem("theme", b.classList.contains("dark") ? "dark" : "light");
};
document.getElementById("today").textContent = new Date().toLocaleDateString("en-IN", {weekday: "long", day: "numeric", month: "long", year: "numeric"});
document.querySelectorAll(".sidebar a").forEach(function (a) {
  var h = a.getAttribute("href");
  if (h === location.pathname || (h !== "/" && location.pathname.indexOf(h) === 0)) a.classList.add("active");
});
setTimeout(function () { document.querySelectorAll(".toast").forEach(function (t) { t.style.display = "none"; }); }, 4000);

document.getElementById("roll").addEventListener("input", function () { this.value = this.value.toUpperCase(); });
document.getElementById("phone").addEventListener("input", function () { this.value = this.value.replace(/\D/g, "").slice(0, 10); });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - Student Attendance</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:"Segoe UI",Arial,sans-serif;background:linear-gradient(135deg,#1e1b4b 0%,#4f46e5 60%,#8b5cf6 100%)}
.card{width:100%;max-width:390px;margin:16px;padding:36px 32px;background:#fff;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.logo{width:52px;height:52px;margin-bottom:16px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:24px;font-weight:700}
h1{margin:0 0 4px;font-size:24px;color:#1e293b}
p{margin:0 0 22px;color:#64748b}
label{display:block;margin-bottom:6px;font-size:13px;font-weight:600;color:#64748b}
input{width:100%;margin-bottom:18px;padding:12px 14px;border:1px solid #e2e8f0;border-radius:10px;font-size:15px}
input:focus{outline:none;border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.2)}
.pw{position:relative}
.pw input{padding-right:64px}
.pw span{position:absolute;right:14px;top:12px;font-size:13px;font-weight:600;color:#4f46e5;cursor:pointer}
button{width:100%;padding:12px;border:0;border-radius:10px;background:#4f46e5;color:#fff;font-size:16px;font-weight:600;cursor:pointer}
button:hover{background:#4338ca}
.msg{margin-bottom:16px;padding:10px 14px;border-radius:8px;font-size:14px}
.msg.error{background:#fee2e2;color:#991b1b}
.msg.success{background:#dcfce7;color:#166534}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">A</div>
    <h1>Welcome back</h1>
    <p>Sign in to Student Attendance System</p>

    {% for m in messages %}
    <div class="msg {{ m.tags }}">{{ m }}</div>
    {% endfor %}

    <form method="post">
      {% csrf_token %}
      <label for="username">Username</label>
      <input type="text" name="username" id="username" required autofocus>

      <label for="password">Password</label>
      <div class="pw">
        <input type="password" name="password" id="password" required>
        <span id="toggle">Show</span>
      </div>

      <button type="submit">Login</button>
    </form>
  </div>

<script>
document.getElementById("toggle").addEventListener("click", function () {
  var box = document.getElementById("password");
  var hidden = box.type === "password";
  box.type = hidden ? "text" : "password";
  this.textContent = hidden ? "Hide" : "Show";
});
</script>
</body>
</html>
